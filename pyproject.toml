[project]
name = "campusx-voice-agent-local"
version = "0.1.0"
description = "CampusX Pipecat voice agent running fully locally (Ollama + faster-whisper + Kokoro)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # "openai" extra is only Pipecat's OpenAI-compatible client, used to talk to Ollama.
    "pipecat-ai[openai,runner,silero,webrtc,websocket,whisper,kokoro]==1.6.0",
    "python-dotenv",
]

[project.optional-dependencies]
moss = ["pipecat-moss>=0.0.3"]

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
